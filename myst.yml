# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: ab22083f-5871-4237-95e1-c2006f9feea5

  title: Matematica.jl
  subject: Início
  description: >-
    Caderno digital em Julia para o ensino de matemática nos anos finais do Ensino
    Fundamental. Sequências didáticas, cadernos Jupyter e orientações ao professor.

  keywords:
    - SPAECE
    - caderno digital
    - Jupyter Notebook
    - Julia
    - ensino fundamental

  github: https://github.com/OnMat/Matematica.jl

  authors:
    - name: José Jailton Azevedo do Nascimento
      affiliation: Universidade Federal do Cariri
    - name: Vicente Helano F. Batista Sobrinho
      affiliation: Universidade Federal do Cariri

  license:
    content: MIT

  toc:
    - file: index.md
    - file: orientacoes.md
    - title: Sequências didáticas
      children:
        - file: familiarizacao/index.md
        - file: algebra/index.md
          children:
            # - file: algebra/atividade01.ipynb
            - file: algebra/atividade02.ipynb
            - file: algebra/atividade03.ipynb
        - file: numeros/index.md
          children:
            # - file: numeros/atividade00.ipynb
            - file: numeros/atividade01.ipynb
            - file: numeros/atividade02.ipynb
            - file: numeros/atividade03.ipynb
            - file: numeros/atividade04.ipynb
            - file: numeros/atividade05.ipynb
        - file: geometria/index.md
          children:
            - file: geometria/atividade01.ipynb
            - file: geometria/atividade02.ipynb
            - file: geometria/Atividade03.ipynb
            # - file: geometria/Atividades Complementares.ipynb
        - file: medidas/index.md
          children:
            - file: medidas/atividade01.ipynb
            - file: medidas/atividade02.ipynb
            - file: medidas/atividade03.ipynb
        - file: estatistica/index.md
          children:
            - file: estatistica/atividade01.ipynb
            - file: estatistica/atividade02.ipynb
            - file: estatistica/atividade03.ipynb
    - file: sobre.md

  exclude:
    - README.md
    - LICENSE
    - capa/**
    - template/**

  numbering:
    exercise:
      template: Exercício %s

extends:
  - export.yml

site:
  template: book-theme
  options:
    style: assets/style.css
    logo: assets/logo.svg
    folders: true
    hide_authors: true
  actions:
    - title: GitHub Repo
      url: https://github.com/OnMat/Matematica.jl
    - title: Feedback
      url: https://github.com/OnMat/Matematica.jl/issues
    - title: Download PDF
      url: ./exports/Matematica.jl.pdf
  # favicon: assets/favicon.ico
